name: BMB Tchad 07 Daily Affiliate Bot

on:
  schedule:
    - cron: '0 6,9,15,18 * * *'  # تشغيل تلقائي 4 مرات يومياً
  workflow_dispatch:              # يسمح بتشغيله يدوياً متى شئت

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-genai

      - name: Run Affiliate Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python bot.py
